<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Reservations</title>
</head>
<body>
    <h1>Room Reservations</h1>

    <main>
        <section class="booking">
            <h2>New reservation</h2>
            <form id="bookingForm">
                <label>
                    Room number
                    <input name="room" type="number" min="1" required>
                </label>
                <label>
                    Reserved by
                    <input name="reserved_by" required>
                </label>
                <label>
                    Date
                    <input name="date" type="date" required>
                </label>
                <label>
                    Start time
                    <input name="start_time" type="time" required>
                </label>
                <label>
                    End time
                    <input name="end_time" type="time" required>
                </label>
                <button>Save reservation</button>
            </form>
            <p id="message" role="status"></p>
        </section>

        <section class="reservations">
            <h2>Reservations</h2>
            <form id="searchForm">
                <label for="searchId">Find by ID</label>
                <input id="searchId" type="number" min="1" placeholder="ID">
                <button>Search</button>
                <button type="button" onclick="loadReservations()">Show all</button>
            </form>
            <form id="deleteForm">
                <label for="deleteId">Delete by ID</label>
                <input id="deleteId" type="number" min="1" placeholder="ID" required>
                <button type="submit" class="delete-button">Delete</button>
            </form>
            <p id="listMessage" role="status"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Room</th>
                            <th>Reserved by</th>
                            <th>Date</th>
                            <th>Start</th>
                            <th>End</th>
                        </tr>
                    </thead>
                    <tbody id="reservationList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById("bookingForm");
        const message = document.getElementById("message");
        const listMessage = document.getElementById("listMessage");
        const table = document.getElementById("reservationList");

        function formatTime(time) {
            const [hours, minutes] = time.split(":");
            const hour = Number(hours);
            const period = hour >= 12 ? "PM" : "AM";
            return (hour % 12 || 12) + ":" + minutes + " " + period;
        }

        async function loadReservations(id = "") {
            table.textContent = "";
            listMessage.textContent = "Loading...";

            try {
                const response = await fetch("/api/reservations" + (id ? "/" + id : ""));
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                const reservations = id ? [data] : data;
                for (const item of reservations) {
                    const row = table.insertRow();
                    const values = [item.id, item.room, item.reserved_by, item.date, formatTime(item.start_time), formatTime(item.end_time)];
                    for (const value of values) row.insertCell().textContent = value;
                }
                listMessage.textContent = reservations.length ? "" : "No reservations yet.";
            } catch (error) {
                listMessage.textContent = error.message;
            }
        }

        async function deleteReservation(id) {
            try {
                const response = await fetch("/api/reservations/" + id, {
                    method: "DELETE"
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                await loadReservations();
                listMessage.textContent = data.message;
            } catch (error) {
                listMessage.textContent = error.message;
            }
        }

        document.getElementById("searchForm").onsubmit = function (event) {
            event.preventDefault();
            loadReservations(document.getElementById("searchId").value);
        };

        document.getElementById("deleteForm").onsubmit = function (event) {
            event.preventDefault();
            deleteReservation(document.getElementById("deleteId").value);
        };

        form.onsubmit = async function (event) {
            event.preventDefault();
            const reservation = Object.fromEntries(new FormData(form));
            const [year, month, day] = reservation.date.split("-");
            reservation.date = month + "/" + day + "/" + year;
            reservation.room = Number(reservation.room);

            const button = form.querySelector("button");
            button.disabled = true;
            message.textContent = "Saving...";

            try {
                const response = await fetch("/api/reservations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(reservation)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message);

                form.reset();
                message.textContent = "Reservation saved!";
                await loadReservations();
            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        };

        loadReservations();
    </script>
</body>
</html>
